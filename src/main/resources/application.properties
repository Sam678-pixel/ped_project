spring.application.name=ped

# ==================== DATASOURCE ====================
# Les identifiants ne doivent pas être versionnés en clair : surchargez-les
# par les variables d'environnement DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_ped?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==================== SCHEMA ====================
# schema.sql est idempotent (CREATE TABLE IF NOT EXISTS) et vit désormais
# dans src/main/resources. Sans cette ligne il n'était jamais exécuté.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# ==================== SÉCURITÉ ====================
# Secret HMAC de signature des jetons. DOIT être surchargé en production.
ped.securite.secret=${PED_SECRET:change-me-in-production-please-use-a-long-random-secret}
ped.securite.expiration-minutes=${PED_EXPIRATION:120}
# Compte administrateur créé au premier démarrage (si absent).
ped.securite.admin.email=${PED_ADMIN_EMAIL:admin@fonea.bi}
ped.securite.admin.mot-de-passe=${PED_ADMIN_PASSWORD:Admin@2026}
# Comptes de démonstration (agent@fonea.bi, entreprise@demo.bi, diplome@demo.bi).
# À passer à false en production.
ped.securite.demo=${PED_DEMO:true}

# ==================== DIVERS ====================
server.error.include-message=never
logging.level.fonea.ped=INFO
